name: Preise aktualisieren
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"   # jeden Montag früh
  push:
    branches: [main]
    paths: ["scripts/update-prices.mjs", "prices/sources.json", ".github/workflows/prices.yml"]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-prices.mjs
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      - name: Ergebnis speichern
        run: |
          git config user.name "Wochentopf Preis-Bot"
          git config user.email "actions@users.noreply.github.com"
          git add prices
          git diff --cached --quiet || git commit -m "Preise aktualisiert"
          git pull --rebase origin main
          git push
